<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="homeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="50%" stop-color="#e5c378"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>

    <!-- Warm Terracotta Maroon Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a83232"/>
      <stop offset="60%" stop-color="#781d22"/>
      <stop offset="100%" stop-color="#4d0e12"/>
    </linearGradient>

    <!-- Wall Soft Warm Cream -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#faebd7"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="homeDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#homeDrop)">
    <!-- Auspicious Kalash & Flag on Roof Top -->
    <path d="M24 6 L25.5 9 L22.5 9 Z" fill="url(#homeGold)"/>
    <circle cx="24" cy="5" r="1.3" fill="url(#homeGold)"/>
    <path d="M24 6 L29 8 L24 10 Z" fill="#d90429"/>

    <!-- Sloped Traditional Tiled Roof (गृह निवास छत) -->
    <path d="M24 9 L7 20 L41 20 Z" fill="url(#roofGrad)" stroke="url(#homeGold)" stroke-width="1"/>
    <!-- Roof Tile Texture Lines -->
    <line x1="24" y1="9" x2="14" y2="20" stroke="url(#homeGold)" stroke-width="0.8" opacity="0.7"/>
    <line x1="24" y1="9" x2="34" y2="20" stroke="url(#homeGold)" stroke-width="0.8" opacity="0.7"/>
    <!-- Roof Eaves Golden Trim -->
    <rect x="6" y="19.5" width="36" height="2" rx="0.5" fill="url(#homeGold)"/>

    <!-- House Walls Body -->
    <rect x="10" y="21" width="28" height="19" rx="0.5" fill="url(#wallGrad)" stroke="#b89358" stroke-width="0.8"/>

    <!-- Auspicious Welcoming Mango & Marigold Toran over Doorway -->
    <path d="M10 23 Q17 26 24 23 Q31 26 38 23" stroke="#ff7900" stroke-width="1.3" stroke-dasharray="1.5 1.5" fill="none"/>

    <!-- Left Traditional Arched Window -->
    <path d="M13 26 C13 24 17 24 17 26 L17 31 L13 31 Z" fill="#781d22" stroke="url(#homeGold)" stroke-width="0.8"/>
    <line x1="15" y1="24.5" x2="15" y2="31" stroke="url(#homeGold)" stroke-width="0.7"/>
    <line x1="13" y1="28" x2="17" y2="28" stroke="url(#homeGold)" stroke-width="0.7"/>

    <!-- Right Traditional Arched Window -->
    <path d="M31 26 C31 24 35 24 35 26 L35 31 L31 31 Z" fill="#781d22" stroke="url(#homeGold)" stroke-width="0.8"/>
    <line x1="33" y1="24.5" x2="33" y2="31" stroke="url(#homeGold)" stroke-width="0.7"/>
    <line x1="31" y1="28" x2="35" y2="28" stroke="url(#homeGold)" stroke-width="0.7"/>

    <!-- Grand Entrance Doorway with Welcoming Arch (स्वागत द्वार) -->
    <path d="M20 40 L20 28 C20 25 28 25 28 28 L28 40 Z" fill="#54111f" stroke="url(#homeGold)" stroke-width="1"/>
    <!-- Sacred Swastika / Shubh Labh Mark above door -->
    <circle cx="24" cy="28" r="1.3" fill="#d90429"/>

    <!-- Auspicious Diyas / Lamps at Doorstep -->
    <circle cx="18" cy="39" r="1.4" fill="url(#homeGold)"/>
    <circle cx="18" cy="37.5" r="0.8" fill="#ff7900"/>
    <circle cx="30" cy="39" r="1.4" fill="url(#homeGold)"/>
    <circle cx="30" cy="37.5" r="0.8" fill="#ff7900"/>

    <!-- Base Plinth -->
    <rect x="7" y="40" width="34" height="2.5" rx="0.5" fill="url(#homeGold)"/>
  </g>
</svg>
