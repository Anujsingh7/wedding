<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="haldiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="urliGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedaa"/>
      <stop offset="60%" stop-color="#c9a45c"/>
      <stop offset="100%" stop-color="#8a6727"/>
    </linearGradient>
    <filter id="haldiDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#haldiDrop)">
    <!-- Auspicious Haldi droplets / turmeric glow -->
    <circle cx="24" cy="7" r="2.2" fill="url(#haldiGrad)"/>
    <circle cx="14" cy="13" r="1.5" fill="url(#haldiGrad)"/>
    <circle cx="34" cy="13" r="1.5" fill="url(#haldiGrad)"/>
    
    <!-- Turmeric Paste Mound (Ubtan / Pithi) -->
    <path d="M15 25 C15 15 33 15 33 25 Z" fill="url(#haldiGrad)"/>
    <!-- Marigold flower accent atop paste -->
    <circle cx="24" cy="18" r="2.2" fill="#ff5722"/>
    <circle cx="24" cy="18" r="1.2" fill="#ffd600"/>
    <path d="M21 21 C22 19 26 19 27 21" stroke="#e65100" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Ornate Brass Urli Bowl Rim -->
    <ellipse cx="24" cy="25" rx="17" ry="4" fill="url(#urliGold)" stroke="#6b4c16" stroke-width="0.8"/>
    <ellipse cx="24" cy="25" rx="14" ry="2.6" fill="#ffb300"/>

    <!-- Urli Bowl Body -->
    <path d="M8 25 C9 36 15 41 24 41 C33 41 39 36 40 25 Z" fill="url(#urliGold)"/>
    <!-- Bowl Carved Traditional Ring Details -->
    <path d="M12 32 C16 36 32 36 36 32" stroke="#fff4cf" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    
    <!-- Urli Stand / Pedestal Base -->
    <path d="M18 41 L16 44 L32 44 L30 41 Z" fill="url(#urliGold)"/>
    
    <!-- Traditional Urli Ring Handles on sides -->
    <circle cx="7" cy="26" r="2.2" stroke="url(#urliGold)" stroke-width="1.5" fill="none"/>
    <circle cx="41" cy="26" r="2.2" stroke="url(#urliGold)" stroke-width="1.5" fill="none"/>
  </g>
</svg>
