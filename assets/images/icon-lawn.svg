<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="lawnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="50%" stop-color="#e5c378"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>

    <!-- Royal Maroon Canopy Gradient -->
    <linearGradient id="canopyMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801b2f"/>
      <stop offset="60%" stop-color="#54111f"/>
      <stop offset="100%" stop-color="#3b0a15"/>
    </linearGradient>

    <!-- Lawn Green Gradient -->
    <linearGradient id="lawnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="70%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="lawnDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#lawnDrop)">
    <!-- Lush Green Marriage Lawn Grass Base (हरी-भरी लॉन) -->
    <ellipse cx="24" cy="42" rx="20" ry="4" fill="url(#lawnGreen)" opacity="0.35"/>
    <path d="M6 42 Q15 39 24 42 Q33 39 42 42" stroke="url(#lawnGreen)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Mandap / Canopy Royal Pinnacle (कलश एवं ध्वज) -->
    <path d="M24 6 L25.5 10 L22.5 10 Z" fill="url(#lawnGold)"/>
    <circle cx="24" cy="5" r="1.5" fill="url(#lawnGold)"/>
    <!-- Festive Red Pennant Flags on roof -->
    <path d="M24 6 L29 8 L24 10 Z" fill="#d90429"/>
    <path d="M8 17 L5 19 L8 20 Z" fill="#d90429"/>
    <path d="M40 17 L43 19 L40 20 Z" fill="#d90429"/>

    <!-- Royal Wedding Canopy / Shamiana Roof (राजसी शामियाना) -->
    <path d="M24 10 C18 12 11 16 7 20 L41 20 C37 16 30 12 24 10 Z" fill="url(#canopyMaroon)" stroke="url(#lawnGold)" stroke-width="1"/>
    
    <!-- Scalloped Canopy Border with Golden Frills & Hanging Pearls -->
    <path d="M7 20 Q10.5 24 14 20 Q17.5 24 21 20 Q24.5 24 28 20 Q31.5 24 35 20 Q38.5 24 41 20" 
          stroke="url(#lawnGold)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="10.5" cy="23.5" r="0.8" fill="url(#lawnGold)"/>
    <circle cx="17.5" cy="23.5" r="0.8" fill="url(#lawnGold)"/>
    <circle cx="24.5" cy="23.5" r="0.8" fill="url(#lawnGold)"/>
    <circle cx="31.5" cy="23.5" r="0.8" fill="url(#lawnGold)"/>
    <circle cx="38.5" cy="23.5" r="0.8" fill="url(#lawnGold)"/>

    <!-- Four Royal Ornate Golden Pillars (मंडप स्तंभ) -->
    <!-- Left Outer Pillar -->
    <rect x="9" y="21" width="2.6" height="19" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="8" y="39" width="4.6" height="2" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="8" y="21" width="4.6" height="1.5" rx="0.5" fill="url(#lawnGold)"/>

    <!-- Left Inner Pillar -->
    <rect x="17" y="21" width="2.2" height="19" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="16" y="39" width="4.2" height="2" rx="0.5" fill="url(#lawnGold)"/>

    <!-- Right Inner Pillar -->
    <rect x="29" y="21" width="2.2" height="19" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="28" y="39" width="4.2" height="2" rx="0.5" fill="url(#lawnGold)"/>

    <!-- Right Outer Pillar -->
    <rect x="36.5" y="21" width="2.6" height="19" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="35.5" y="39" width="4.6" height="2" rx="0.5" fill="url(#lawnGold)"/>
    <rect x="35.5" y="21" width="4.6" height="1.5" rx="0.5" fill="url(#lawnGold)"/>

    <!-- Decorative Floral Toran Garlands (गेंदे की तोरण माला) inside arch -->
    <path d="M11 25 Q17 29 24 25 Q31 29 37 25" stroke="#ff7900" stroke-width="1.4" stroke-dasharray="1.5 1.5" fill="none"/>
    <path d="M19 28 Q24 31 29 28" stroke="#ffd000" stroke-width="1.2" stroke-dasharray="1.2 1.2" fill="none"/>

    <!-- Auspicious Kalash / Diya at the Center of the Lawn Mandap -->
    <path d="M22 36 L26 36 L25 39 L23 39 Z" fill="url(#lawnGold)"/>
    <circle cx="24" cy="35" r="1.5" fill="#ff7900"/>
    <circle cx="24" cy="33" r="0.9" fill="#ffd000"/>
  </g>
</svg>
