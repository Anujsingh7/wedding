<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="40%" stop-color="#f0c665"/>
      <stop offset="80%" stop-color="#c9a45c"/>
      <stop offset="100%" stop-color="#805b0d"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="70%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#007200"/>
    </linearGradient>
    <linearGradient id="nariyalBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="60%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#583101"/>
    </linearGradient>
    <filter id="kalashDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#kalashDrop)">
    <!-- Sacred Coconut (श्रीफल) atop Kalash -->
    <path d="M24 7 C21 11 20 16 24 19 C28 16 27 11 24 7 Z" fill="url(#nariyalBrown)"/>
    <path d="M23 6 L25 6 L24 4 Z" fill="#583101"/>
    
    <!-- Sacred Mango Leaves (आम्रपल्लव) radiating out -->
    <path d="M22 17 C16 14 12 11 11 7 C14 11 18 15 22 17 Z" fill="url(#leafGreen)"/>
    <path d="M23 18 C19 14 16 9 17 6 C19 10 22 14 23 18 Z" fill="url(#leafGreen)"/>
    <path d="M25 18 C29 14 32 9 31 6 C29 10 26 14 25 18 Z" fill="url(#leafGreen)"/>
    <path d="M26 17 C32 14 36 11 37 7 C34 11 30 15 26 17 Z" fill="url(#leafGreen)"/>

    <!-- Kalash Neck & Rim -->
    <ellipse cx="24" cy="20" rx="9" ry="2.2" fill="url(#kalashGold)" stroke="#6b4c16" stroke-width="0.8"/>
    <path d="M16 20 C17 23 31 23 32 20 Z" fill="#805b0d"/>

    <!-- Kalash Pot Body (स्वर्ण कलश) -->
    <path d="M16 21 C12 25 10 32 14 38 C17 41 31 41 34 38 C38 32 36 25 32 21 Z" fill="url(#kalashGold)"/>
    
    <!-- Sacred Red Mauli / Kalawa Thread & Swastika -->
    <path d="M13 30 C18 34 30 34 35 30" stroke="#d90429" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M24 26 L24 34 M20 30 L28 30 M24 26 L26 26 M28 30 L28 32 M24 34 L22 34 M20 30 L20 28" 
          stroke="#d90429" stroke-width="1.3" stroke-linecap="square" fill="none"/>

    <!-- Kalash Base Stand -->
    <path d="M18 39 L16 43 L32 43 L30 39 Z" fill="url(#kalashGold)"/>
  </g>
</svg>
