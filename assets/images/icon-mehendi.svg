<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Gold Gradient for Shagun Thali -->
    <linearGradient id="thaliGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="50%" stop-color="#e5c378"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>

    <!-- Mehendi Cones Green Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#143625"/>
    </linearGradient>

    <!-- Diya Flame Glow -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="40%" stop-color="#ff7b00"/>
      <stop offset="80%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="thaliDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#thaliDrop)">
    <!-- Ornate Brass Shagun Thali Rim (वर पक्ष शगुन थाली) -->
    <ellipse cx="24" cy="31" rx="19" ry="9" fill="url(#thaliGold)" stroke="#6b4c16" stroke-width="0.8"/>
    <!-- Inner Thali Base -->
    <ellipse cx="24" cy="31" rx="16" ry="7" fill="#fdf6e7" stroke="url(#thaliGold)" stroke-width="1"/>
    <!-- Decorative Scalloped Thali Pearls -->
    <circle cx="9" cy="31" r="0.9" fill="#9a6e1a"/>
    <circle cx="13" cy="36" r="0.9" fill="#9a6e1a"/>
    <circle cx="24" cy="37.5" r="0.9" fill="#9a6e1a"/>
    <circle cx="35" cy="36" r="0.9" fill="#9a6e1a"/>
    <circle cx="39" cy="31" r="0.9" fill="#9a6e1a"/>
    <circle cx="35" cy="26" r="0.9" fill="#9a6e1a"/>
    <circle cx="13" cy="26" r="0.9" fill="#9a6e1a"/>

    <!-- Mehendi Cone 1 (Angled Left) -->
    <path d="M12 21 L32 34 L31 36 Z" fill="url(#coneGrad)" stroke="url(#thaliGold)" stroke-width="0.7"/>
    <ellipse cx="12" cy="21" rx="2.5" ry="1.4" fill="url(#thaliGold)" transform="rotate(-30 12 21)"/>
    <line x1="17" y1="24" x2="16" y2="26" stroke="#fff4cf" stroke-width="0.8"/>
    <line x1="22" y1="27" x2="21" y2="29" stroke="#fff4cf" stroke-width="0.8"/>
    <!-- Henna paste tip -->
    <circle cx="32" cy="35" r="0.8" fill="#5c1d06"/>

    <!-- Mehendi Cone 2 (Angled Right - Crossed) -->
    <path d="M36 21 L16 34 L17 36 Z" fill="url(#coneGrad)" stroke="url(#thaliGold)" stroke-width="0.7"/>
    <ellipse cx="36" cy="21" rx="2.5" ry="1.4" fill="url(#thaliGold)" transform="rotate(30 36 21)"/>
    <line x1="31" y1="24" x2="32" y2="26" stroke="#fff4cf" stroke-width="0.8"/>
    <line x1="26" y1="27" x2="27" y2="29" stroke="#fff4cf" stroke-width="0.8"/>
    <!-- Henna paste tip -->
    <circle cx="16" cy="35" r="0.8" fill="#5c1d06"/>

    <!-- Auspicious Marigold Flowers (गेंदे के फूल) on Thali -->
    <!-- Left Marigold -->
    <circle cx="10" cy="30" r="3.2" fill="#ff7900"/>
    <circle cx="10" cy="30" r="1.8" fill="#ffd000"/>
    <circle cx="10" cy="30" r="0.8" fill="#d90429"/>
    <!-- Right Marigold -->
    <circle cx="38" cy="30" r="3.2" fill="#ff7900"/>
    <circle cx="38" cy="30" r="1.8" fill="#ffd000"/>
    <circle cx="38" cy="30" r="0.8" fill="#d90429"/>

    <!-- Sacred Golden Diya (मंगल दीप) in Center -->
    <path d="M19 28 C19 33 29 33 29 28 Z" fill="url(#thaliGold)" stroke="#6b4c16" stroke-width="0.7"/>
    <ellipse cx="24" cy="28" rx="5" ry="1.6" fill="#7a2107"/>
    
    <!-- Sacred Glowing Flame of the Diya -->
    <path d="M24 16 C22 21 21 24 22.5 27 C24 28 25.5 27 25.5 24 C25.5 21 24 16 24 16 Z" fill="url(#flameGrad)"/>
    <circle cx="24" cy="24" r="1" fill="#ffffff" opacity="0.8"/>

    <!-- Auspicious Shagun Tilak / Kumkum Dots (रोली अक्षत) -->
    <circle cx="24" cy="35" r="1.2" fill="#d90429"/>
    <circle cx="21" cy="34" r="0.8" fill="#fff8db"/>
    <circle cx="27" cy="34" r="0.8" fill="#fff8db"/>
  </g>
</svg>
